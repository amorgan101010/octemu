<!doctype html>
<!--
  The Octatrack's front panel in a browser, served by octemu (src/remote.c,
  which has the protocol). The face plate is assets/panel/octatrack.svg, the
  same drawing the window's raster is made from, lit through its own lighting
  API (class "lit", colour in --lit; see assets/panel/README.md).

  Touch: keys are held while a finger is on them, so any chord works (hold a
  trig and turn a knob for a parameter lock). A knob turns when dragged, up or
  right being clockwise; a quick tap clicks its switch; hold it still for a
  moment and it pushes, and a drag from there is a push-turn. The crossfader
  handle drags. The headphones knob is the monitor volume on the host.

  SPDX-License-Identifier: MIT
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2b2c2e">
<title>Octatrack remote</title>
<style>
html, body {
  margin: 0; height: 100%; background: #2b2c2e; overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
#panel {
  position: fixed;
  inset: env(safe-area-inset-top) env(safe-area-inset-right)
         env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#panel svg { width: 100%; height: 100%; display: block; }
#oled {
  position: fixed; image-rendering: pixelated; image-rendering: crisp-edges;
  pointer-events: none;
}
/* held: the cap sinks, as the window draws it */
.key { cursor: pointer; }
.key.down { transform: translate(1.2px, 1.8px); }
.key.down > rect:nth-of-type(3) { fill: #232426; }
.knob { cursor: grab; }
.knob .halo { fill: none; stroke: #ffd23e; stroke-width: 3; opacity: 0;
  transition: opacity .12s; }
.knob.touched .halo { opacity: .45; }
.knob.pushed .halo { opacity: 1; }
.knob .tick { stroke: #c9cbcd; stroke-width: 2.4; stroke-linecap: round; }
#fader-handle { cursor: ew-resize; }
#status {
  position: fixed; right: 10px; bottom: calc(6px + env(safe-area-inset-bottom));
  color: #8a8c8e; font-size: 12px; padding: 4px 6px;
}
#status.bad { color: #ffd23e; }
</style>
</head>
<body>
<div id="panel"></div>
<canvas id="oled" width="128" height="64"></canvas>
<div id="status">loading</div>
<script>
'use strict';
const PLATE = '34 35 1177 611';        // the face plate, without the chassis
const DETENT = 7;                      // SVG units of drag per detent
const PUSH_MS = 380;                   // hold a knob this still to push it
const TAP_MS = 70;                     // how long a tap holds the switch
const SCREEN_ON = [0xd8, 0xf0, 0xff], SCREEN_OFF = [0x18, 0x1c, 0x1e];

const holder = document.getElementById('panel');
const oled = document.getElementById('oled');
const octx = oled.getContext('2d');
const img = octx.createImageData(128, 64);
const statusEl = document.getElementById('status');
let svg = null, elements = null, layout = null, ws = null, retry = 500;
let lampEls = [], lampLast = [], keyEls = new Map(), keysLast = null;
let faderDx = 0, faderDrag = null, phonesLast = -1;
const knobs = new Map();               // svg id -> {g, tick, cx, cy, angle}
const pointers = new Map();            // pointerId -> gesture

function say(text, bad) { statusEl.textContent = text; statusEl.className = bad ? 'bad' : ''; }
function send(text) { if (ws && ws.readyState === 1) ws.send(text); }
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* ---- the face plate ---------------------------------------------------- */
async function load() {
  say('loading the panel');
  try {
    const [s, j] = await Promise.all([fetch('panel.svg'), fetch('elements.json')]);
    if (!s.ok || !j.ok) throw new Error('the panel drawing is missing (make panel-svg)');
    holder.innerHTML = await s.text();
    elements = await j.json();
  } catch (e) {
    say(String(e.message || e), true);
    setTimeout(load, 3000);
    return;
  }
  svg = holder.querySelector('svg');
  svg.setAttribute('viewBox', PLATE);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  for (const [id, k] of Object.entries(elements.knobs)) {
    const g = svg.getElementById(id);
    if (!g) continue;
    g.classList.add('knob');
    svgEl('circle', {class: 'halo', cx: k.cx, cy: k.cy, r: k.r + 4}, g);
    let tick = null;
    if (id !== 'knob-phones') {        // encoders are endless: our own mark
      tick = svgEl('line', {class: 'tick', x1: k.face_cx, y1: k.face_cy - k.face_r + 4,
                            x2: k.face_cx, y2: k.face_cy - k.face_r + 11}, g);
    }
    knobs.set(id, {g, tick, cx: k.face_cx, cy: k.face_cy, angle: 0});
  }
  svg.addEventListener('pointerdown', down);
  placeScreen();
  bind();
  connect();
}

function placeScreen() {
  if (!svg) return;
  const r = svg.getElementById('screen').getBoundingClientRect();
  Object.assign(oled.style, {left: r.left + 'px', top: r.top + 'px',
                             width: r.width + 'px', height: r.height + 'px'});
}
addEventListener('resize', placeScreen);
addEventListener('orientationchange', () => setTimeout(placeScreen, 300));

/* The layout names the lamps (the state's order) and the keys. */
function bind() {
  if (!svg || !layout) return;
  lampEls = layout.lamps.map((id) => svg.getElementById(id));
  lampLast = layout.lamps.map(() => -1);
  keyEls.clear();
  for (const [id, n] of Object.entries(layout.keys)) {
    const g = svg.getElementById(id);
    if (g) keyEls.set(n, g);
  }
  keysLast = null;
}

/* ---- the wire ---------------------------------------------------------- */
/* ☠ Never open a WebSocket to a server that is down. Firefox remembers
 * failed WebSocket connections per host:port and makes every later one wait,
 * up to about a minute, across reloads too: a tab left retrying while octemu
 * was closed took 41-46 s to connect once it was back (measured). So probe
 * with a plain request, which Firefox does not penalise, and only then open
 * the socket. */
function retryLater(text) {
  say(text, true);
  setTimeout(connect, retry);
  retry = Math.min(retry * 2, 2000);
}

/* Timings for the server's OCTA_REMOTE_LOG, which is where a slow connect is
 * diagnosed: ms since the page loaded. Best effort; nothing waits on it. */
function note(text) {
  fetch('note?' + encodeURIComponent(Math.round(performance.now()) + 'ms ' + text),
        {cache: 'no-store'}).catch(() => {});
}

async function connect() {
  say('connecting');
  try {
    const r = await fetch('ping', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    retryLater('waiting for octemu');
    return;
  }
  const asked = performance.now();
  note('ping ok; new WebSocket now (hidden=' + document.hidden + ')');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    note('websocket open ' + Math.round(performance.now() - asked) + 'ms after new WebSocket');
    retry = 500; say('connected'); send('hello');
  };
  ws.onclose = (ev) => {
    note('websocket closed code=' + ev.code + ' clean=' + ev.wasClean + ' ' +
         Math.round(performance.now() - asked) + 'ms after new WebSocket');
    letGoAll(false);
    retryLater('reconnecting');
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      if (ev.data.startsWith('L ')) { layout = JSON.parse(ev.data.slice(2)); bind(); }
    } else {
      state(new Uint8Array(ev.data));
    }
  };
}

function state(b) {
  if (!layout || b[0] !== 0x53) return;
  let o = 1;
  const px = img.data;
  for (let i = 0; i < 1024; i++, o++) {
    const v = b[o];
    for (let bit = 0; bit < 8; bit++) {
      const c = (v >> (7 - bit)) & 1 ? SCREEN_ON : SCREEN_OFF, p = (i * 8 + bit) * 4;
      px[p] = c[0]; px[p + 1] = c[1]; px[p + 2] = c[2]; px[p + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  const keys = b.subarray(o, o + 8); o += 8;
  for (const [n, g] of keyEls) {
    const on = (keys[n >> 3] >> (n & 7)) & 1;
    if (!keysLast || on !== ((keysLast[n >> 3] >> (n & 7)) & 1)) g.classList.toggle('down', !!on);
  }
  keysLast = keys.slice();
  const xf = b[o++];
  if (!faderDrag) setFader(166 * (255 - xf) / 255);   // wire 255 = far LEFT
  const ph = b[o++];
  if (ph !== phonesLast) {
    phonesLast = ph;
    const k = knobs.get('knob-phones'), ptr = k && k.g.querySelector('.pointer');
    if (ptr) ptr.setAttribute('transform', 'rotate(' + (270 * ph / 255) + ' ' + k.cx + ' ' + k.cy + ')');
  }
  // Only touch a lamp whose colour changed: every lit one runs a glow filter.
  for (let i = 0; i < lampEls.length; i++, o += 3) {
    const rgb = (b[o] << 16) | (b[o + 1] << 8) | b[o + 2];
    if (rgb === lampLast[i] || !lampEls[i]) continue;
    lampLast[i] = rgb;
    const el = lampEls[i];
    if (rgb) {
      el.style.setProperty('--lit', 'rgb(' + b[o] + ',' + b[o + 1] + ',' + b[o + 2] + ')');
      el.classList.add('lit');
    } else {
      el.classList.remove('lit');
    }
  }
}

function setFader(dx) {
  faderDx = Math.max(0, Math.min(166, dx));
  const h = svg && svg.getElementById('fader-handle');
  if (h) h.setAttribute('transform', 'translate(' + faderDx.toFixed(1) + ' 0)');
}

/* ---- touch ------------------------------------------------------------- */
const unitsPerPx = () => { const m = svg.getScreenCTM(); return m ? 1 / m.a : 1; };

function down(e) {
  const t = e.target;
  const key = t.closest('.key'), knob = t.closest('.knob'), fader = t.closest('#fader-handle');
  if (!key && !knob && !fader) return;
  e.preventDefault();
  (key || knob || fader).setPointerCapture(e.pointerId);
  if (key) {
    pointers.set(e.pointerId, {kind: 'b', id: key.id});
    key.classList.add('down');
    send('b ' + key.id + ' 1');
  } else if (knob) {
    const p = {kind: 'e', id: knob.id, g: knob, x: e.clientX, y: e.clientY, acc: 0,
               moved: false, pushed: false, t: performance.now()};
    knob.classList.add('touched');
    if (knob.id !== 'knob-phones') {
      p.timer = setTimeout(() => {
        if (p.moved || !pointers.has(e.pointerId)) return;
        p.pushed = true;
        knob.classList.add('pushed');
        send('p ' + p.id + ' 1');
      }, PUSH_MS);
    }
    pointers.set(e.pointerId, p);
  } else {
    faderDrag = {x: e.clientX, dx: faderDx, sent: -1};
    pointers.set(e.pointerId, {kind: 'x'});
  }
}

function move(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  if (p.kind === 'x') {
    setFader(faderDrag.dx + (e.clientX - faderDrag.x) * unitsPerPx());
    const v = Math.round(255 - faderDx * 255 / 166);
    if (v !== faderDrag.sent) { faderDrag.sent = v; send('x ' + v); }
    return;
  }
  if (p.kind !== 'e') return;
  // up or right turns clockwise
  p.acc += ((e.clientX - p.x) - (e.clientY - p.y)) * unitsPerPx() / DETENT;
  p.x = e.clientX; p.y = e.clientY;
  const n = Math.trunc(p.acc);
  if (!n) return;
  p.moved = true;
  p.acc -= n;
  send('e ' + p.id + ' ' + n);
  const k = knobs.get(p.id);
  if (k && k.tick) {
    k.angle = (k.angle + n * 15) % 360;
    k.tick.setAttribute('transform', 'rotate(' + k.angle + ' ' + k.cx + ' ' + k.cy + ')');
  }
}

function up(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  if (p.kind === 'b') {
    send('b ' + p.id + ' 0');
    const g = svg.getElementById(p.id);
    // the state puts it back if the window still holds it
    if (g) g.classList.remove('down');
    keysLast = null;
  } else if (p.kind === 'e') {
    clearTimeout(p.timer);
    p.g.classList.remove('touched', 'pushed');
    if (p.pushed) {
      send('p ' + p.id + ' 0');
    } else if (!p.moved && p.id !== 'knob-phones' && e.type === 'pointerup') {
      send('p ' + p.id + ' 1');        // a tap: click the switch
      setTimeout(() => send('p ' + p.id + ' 0'), TAP_MS);
    }
  } else if (p.kind === 'x') {
    faderDrag = null;
  }
}

function letGoAll(tell) {
  for (const id of [...pointers.keys()]) up({pointerId: id, type: 'pointercancel'});
  if (tell) send('r');
}

addEventListener('pointermove', move);
addEventListener('pointerup', up);
addEventListener('pointercancel', up);
addEventListener('blur', () => letGoAll(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) letGoAll(true); });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
statusEl.addEventListener('click', () => {
  const d = document.documentElement;
  if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {});
});
// Say what went wrong rather than sitting on "loading".
addEventListener('error', (e) => say('error: ' + e.message, true));
addEventListener('unhandledrejection', (e) => say('error: ' + (e.reason && e.reason.message || e.reason), true));
load();
</script>
</body>
</html>
